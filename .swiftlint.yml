# スタイルはagentが書くため検査しない。コンパイラが拾わない実行時クラッシュの原因と、負荷によってときどき落ちるテストの書き方だけを禁止する
only_rules:
  - force_unwrapping
  - force_try
  - implicitly_unwrapped_optional
  - time_dependent_test
  - yield_based_waiting
  - image_decoding_outside_decoder
  - direct_time_access
  - built_in_context_menu
  - server_value_without_check
  - unsafe_file_name
  - url_session_outside_network_layer
  - network_conditions_outside_policy
  - test_file_without_scratch
  - failure_reason_outside_display

included:
  - App
  - AppTests
  - AppUITests
  - ShareExtension
  - Packages/SciaCore/Sources
  - Packages/SciaCore/Tests
  - Packages/MemoryCache/Sources
  - Packages/MemoryCache/Tests
  - Packages/TextKit2Label/Sources
  - Packages/TextKit2Label/Tests

custom_rules:
  # 時間の長さで順を作ったり、今の時刻で結果が変わったりするテストは、負荷や実行の時刻によってときどきだけ落ちる。
  # 待つ処理には手で進める時計（SciaTestingのTestClock）を渡し、ほかの処理を待つときは門（Gate）か条件（waitUntil）で待つ。日時は決まった値で作る
  time_dependent_test:
    included: "(AppTests|Packages/SciaCore/Tests|Packages/MemoryCache/Tests|Packages/TextKit2Label/Tests)/.*\\.swift"
    regex: "\\b(Task\\.sleep|Thread\\.sleep|usleep|DispatchTime\\.now|CACurrentMediaTime|CFAbsoluteTimeGetCurrent|ContinuousClock|SuspendingClock|asyncAfter)\\b|\\bTimer(\\(|\\.scheduledTimer\\b|\\.publish\\b)|\\bDate\\(\\)|\\bDate\\.init\\b(?!\\([^)])|\\bDate\\.now\\b|\\bDate\\(timeIntervalSinceNow|(?<![\\w.)\\]])\\.now\\b|\\bsystemUptime\\b"
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "テストを実際の時間や今の時刻に頼らせない。待つ処理にはTestClockを渡し、ほかの処理はGateかwaitUntilで待ち、日時は決まった値で作る"
    severity: error

  # テストが毎回違う名前で作る一時ファイルと設定の保存先は、消さないと走らせるたびに溜まる。アプリのテストは端末のアプリのコンテナに、
  # SciaCoreのテストはMacのユーザーのtmpとLibrary/Preferencesに残り、何万にもなっていた。SciaTestingのTestScratchで作ると、`.scratch`を付けたテストの終わりに消す
  test_file_without_scratch:
    included: "(AppTests|Packages/SciaCore/Tests|Packages/MemoryCache/Tests|Packages/TextKit2Label/Tests)/.*\\.swift"
    regex: "\\bUserDefaults\\(suiteName: \"|\\.temporaryDirectory\\b|\\bNSTemporaryDirectory\\("
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "テストで作る一時ファイルと設定の保存先は、TestScratchで作り、テストかスイートに.scratchを付ける"
    severity: error

  # 譲る回数で待つテストは、相手がどこまで進んだかを実行の順の都合に任せる。1回譲っただけでは相手が走ったとは限らず、
  # 「何も起きない」ことを確かめる前に、起きるはずの処理がまだ始まっていないことがある。譲り続ける待ちは、固まっても止まらない。
  # 条件で待つ（waitUntil）か、止めた相手が着いたことを門（Gate）で確かめる
  yield_based_waiting:
    included: "(AppTests|Packages/SciaCore/Tests|Packages/MemoryCache/Tests|Packages/TextKit2Label/Tests)/.*\\.swift"
    regex: "\\bTask\\.yield\\b"
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "テストをTask.yieldで待たせない。条件はwaitUntilで、止めた相手が着いたことはGateで確かめる"
    severity: error

  # 画像の縮め方と展開の仕方を、ストアごとに書かない。コピーするうちに、HDRの指定や縮める大きさが場所ごとにずれ、
  # 絵文字の静止画だけ原寸のまま描くたびにメインスレッドで展開する、ということが起きていた。ImageDecoderで読む
  image_decoding_outside_decoder:
    included: "(App/Sources|ShareExtension|Packages/SciaCore/Sources/SciaCore)/.*\\.swift"
    excluded: "(App/Sources/Debug/|Packages/SciaCore/Sources/SciaCore/Media/ImageDecoder\\.swift)"
    regex: "\\bUIImage\\(data:|\\bCGImageSourceCreateThumbnailAtIndex\\b"
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "画像はImageDecoderで縮めて展開する。HDRかSDRかと縮める大きさを引数で選ぶ"
    severity: error

  # サーバーから来る件数とURLは、読むところで確かめる（ServerValues.swift）。件数はあふれないよう範囲に収め、URLは使い道ごとにスキームを確かめる。
  # 整数やURLとして直接読むと、範囲の外の数で計算が落ちたり、file:などのURLで端末のファイルやほかのアプリを開いたりする
  server_value_without_check:
    included: "Packages/SciaCore/Sources/SciaCore/(Models|Networking|Streaming|XPosts)/.*\\.swift"
    regex: "\\b(decode|decodeIfPresent)\\((Int|URL)\\.self"
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "サーバーから来る値は、件数ならdecodeCount、上限ならServerLimit、URLならdecodeURLかdecodeRequiredURLで読む"
    severity: error

  # ファイルやフォルダーの名前は、URLやサーバーの応答、ほかのアプリから受け取ったファイルから作ることが多く、そのままつなげると`/`や`..`で置く場所がフォルダーの外へ出る。
  # 文字列の決まった名前でなければ、SafeFileNameで作ってappending(fileName:)でつなげる。通信のURLを組み立てる場所（Networking、Auth、Streaming、XPosts）は、ファイルを扱わないので対象外にする
  unsafe_file_name:
    included: "(App/Sources|ShareExtension|Packages/SciaCore/Sources/SciaCore)/.*\\.swift"
    excluded: "(App/Sources/Debug/|Packages/SciaCore/Sources/SciaCore/(Networking|Auth|Streaming|XPosts)/|Packages/SciaCore/Sources/SciaCore/SafeFileName\\.swift)"
    regex: "\\.appending\\((path|component):(?!\\s*\")|\\.appendingPathComponent\\("
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "文字列の決まった名前でなければ、SafeFileNameで作ってappending(fileName:)でつなげる"
    severity: error

  # 実際の時間に、ロジックの中から直接触れない。時間をおく処理はClockで、今の日付は日付を返す関数で、Core Animationの時間は時間を返す関数で受け取り、
  # 既定値はSciaCoreのSystemTimeかアプリのAppDependenciesを参照する。実物を作ってよいのはその2つのファイルだけにする。
  # デバッグ用のコード（ダミーのサーバーや部品カタログ）は、人が見るためにわざと遅らせるもので、テストで確かめるロジックではないため対象外にする
  direct_time_access:
    included: "(App/Sources|ShareExtension|Packages/SciaCore/Sources/SciaCore|Packages/MemoryCache/Sources|Packages/TextKit2Label/Sources)/.*\\.swift"
    excluded: "(App/Sources/Debug/|App/Sources/AppDependencies\\.swift|Packages/SciaCore/Sources/SciaCore/SystemTime\\.swift)"
    regex: "\\b(Task\\.sleep|Thread\\.sleep|usleep|DispatchTime\\.now|CACurrentMediaTime|CFAbsoluteTimeGetCurrent|ContinuousClock|SuspendingClock|asyncAfter)\\b|\\bTimer(\\(|\\.scheduledTimer\\b|\\.publish\\b)|\\bDate\\(\\)|\\bDate\\.init\\b(?!\\([^)])|\\bDate\\.now\\b|\\bDate\\(timeIntervalSinceNow|(?<![\\w.)\\]])\\.now\\b|\\bsystemUptime\\b"
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "実際の時間に直接触れない。時間をおく処理はClockで、今の日付は日付を返す関数で受け取り、既定値はSystemTimeかAppDependenciesを参照する"
    severity: error

  # 失敗の理由の文言を部品を通さずに出すと、ログアウトされたときの「ログインし直す」が付かない。今回、場所ごとに付けて回り、投稿欄、リスト、通報で漏れた。
  # 文言はSciaCoreでSPI（FailureDisplay）にしてあるので、それを読むimportを、部品のファイル（App/Sources/Notices/FailureDisplay.swift）だけに限る
  failure_reason_outside_display:
    included: "(App/Sources|ShareExtension)/.*\\.swift"
    excluded: "App/Sources/Notices/FailureDisplay\\.swift"
    regex: "@_spi\\(FailureDisplay\\)"
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "失敗の理由は、FailureDisplay.swiftの部品（UIAlertController.failure、FailureReason、FailureReasonStackView、failureAlert）で出す"
    severity: error

  # 回線を経路ごとに読み分けると、モバイル通信で控える経路と控えない経路が混ざり、新しく足した経路が決まりから漏れる（docs/network.mdの「通信の目的」）
  network_conditions_outside_policy:
    included: "(App/Sources|ShareExtension|Packages/SciaCore/Sources/SciaCore)/.*\\.swift"
    excluded: "Packages/SciaCore/Sources/SciaCore/Networking/(NetworkConditionsMonitor|NetworkUsePolicy|NetworkPathTracker|RequestPurpose|HTTPClient)\\.swift"
    regex: "\\b(isExpensive|isConstrained|allowsExpensiveNetworkAccess|allowsConstrainedNetworkAccess)\\b|\\bNWPathMonitor\\b|\\bnetwork\\.conditions\\b"
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "回線の状態を読んで送るかを分けない。目的（RequestPurpose）を名乗り、送ってよいかはNetworkUsePolicyに聞く"
    severity: error

  # コントロールに組み込まれた長押しのメニューは、開いても触覚フィードバックが出ず、ボタンはメニューに変形する形で出る。サムネイルで直したあとに足した本文のリンクで、同じ抜けがまた起きた。
  # 長押しのメニューは、別に付けたUIContextMenuInteractionで出す（MediaMenuInteraction、ObjectInteraction、LinkHitAreaのLinkMenuInteraction）
  built_in_context_menu:
    included: "(App/Sources|ShareExtension)/.*\\.swift"
    regex: "\\bisContextMenuInteractionEnabled\\s*=\\s*true\\b"
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "長押しのメニューは、コントロールに組み込まれたメニューではなく、別に付けたUIContextMenuInteractionで出す。組み込まれたメニューでは触覚フィードバックが出ない"
    severity: error

  # URLSessionは、通信の層のURLSessionTransport.swiftでだけ使う。ほかの場所で直接使うと、HTTPClientの決まり（再開の時刻で止める、送り直す、大きさの上限、httpとhttps以外を開かない）を通らない経路ができる。
  # 429への対応をREST APIのクライアントにだけ作ったため、ストリーミングや動画の最初のコマやXの投稿が再開の時刻を守らなかった。通信はHTTPClient（APIの外はAppDependencies.http）を、WebSocketはStreamingClientを通す（docs/network.md）。
  # 動画の再生（AVPlayerItem(url:)）はAVFoundationが範囲と先読みを自分で決めて読むため、層に載せない例外にしている
  url_session_outside_network_layer:
    included: "(App/Sources|ShareExtension|Packages/SciaCore/Sources/SciaCore)/.*\\.swift"
    excluded: "Packages/SciaCore/Sources/SciaCore/Networking/URLSessionTransport\\.swift"
    regex: "\\bURLSession(Configuration|Task|DataTask|DownloadTask|UploadTask|WebSocketTask|TaskDelegate|DataDelegate|DownloadDelegate|WebSocketDelegate)?\\b"
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "URLSessionはURLSessionTransport.swiftでだけ使う。通信はHTTPClient（APIの外はAppDependencies.http）を、WebSocketはStreamingClientを通す（docs/network.md）"
    severity: error

strict: true
