# スタイルはagentが書くため検査しない。コンパイラが拾わない実行時クラッシュの原因と、負荷によってときどき落ちるテストの書き方だけを禁止する
only_rules:
  - force_unwrapping
  - force_try
  - implicitly_unwrapped_optional
  - present_without_waiting
  - time_dependent_test
  - yield_based_waiting
  - image_decoding_outside_decoder
  - direct_time_access
  - fixed_font_size
  - dimmed_white_text
  - session_task_outside_scope

included:
  - App
  - AppTests
  - AppUITests
  - ShareExtension
  - Packages/SciaCore/Sources
  - Packages/SciaCore/Tests

custom_rules:
  # 出る途中の画面の上に確認やシートを出すと、UIKitは出さずに捨てる。出した直後の待ちは負荷のかかった実行では出し終える前に抜けるため、ときどきだけ落ちる
  present_without_waiting:
    included: "AppTests/.*\\.swift"
    regex: "(?<!func )\\bpresent\\([^\\n]*animated:"
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "テストで画面を出すときは、presentForTestingで出し終えるまで待つ。出る途中を確かめるときだけ、理由を書いてこの規則を外す"
    severity: error

  # 時間の長さで順を作ったり、今の時刻で結果が変わったりするテストは、負荷や実行の時刻によってときどきだけ落ちる。
  # 待つ処理には手で進める時計（SciaTestingのTestClock）を渡し、ほかの処理を待つときは門（Gate）か条件（waitUntil）で待つ。日時は決まった値で作る
  time_dependent_test:
    included: "(AppTests|Packages/SciaCore/Tests)/.*\\.swift"
    regex: "\\b(Task\\.sleep|Thread\\.sleep|usleep|DispatchTime\\.now|CACurrentMediaTime|CFAbsoluteTimeGetCurrent|ContinuousClock|SuspendingClock|asyncAfter)\\b|\\bTimer(\\(|\\.scheduledTimer\\b|\\.publish\\b)|\\bDate\\(\\)|\\bDate\\.init\\b(?!\\([^)])|\\bDate\\.now\\b|\\bDate\\(timeIntervalSinceNow|(?<![\\w.)\\]])\\.now\\b|\\bsystemUptime\\b"
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "テストを実際の時間や今の時刻に頼らせない。待つ処理にはTestClockを渡し、ほかの処理はGateかwaitUntilで待ち、日時は決まった値で作る"
    severity: error

  # 譲る回数で待つテストは、相手がどこまで進んだかを実行の順の都合に任せる。1回譲っただけでは相手が走ったとは限らず、
  # 「何も起きない」ことを確かめる前に、起きるはずの処理がまだ始まっていないことがある。譲り続ける待ちは、固まっても止まらない。
  # 条件で待つ（waitUntil）か、止めた相手が着いたことを門（Gate）で確かめる
  yield_based_waiting:
    included: "(AppTests|Packages/SciaCore/Tests)/.*\\.swift"
    regex: "\\bTask\\.yield\\b"
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "テストをTask.yieldで待たせない。条件はwaitUntilで、止めた相手が着いたことはGateで確かめる"
    severity: error

  # 画像の縮め方と展開の仕方を、ストアごとに書かない。コピーするうちに、HDRの指定や縮める大きさが場所ごとにずれ、
  # 絵文字の静止画だけ原寸のまま描くたびにメインスレッドで展開する、ということが起きていた。ImageDecoderで読む
  image_decoding_outside_decoder:
    included: "(App/Sources|ShareExtension|Packages/SciaCore/Sources/SciaCore)/.*\\.swift"
    excluded: "(App/Sources/Debug/|Packages/SciaCore/Sources/SciaCore/Media/ImageDecoder\\.swift)"
    regex: "\\bUIImage\\(data:|\\bCGImageSourceCreateThumbnailAtIndex\\b"
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "画像はImageDecoderで縮めて展開する。HDRかSDRかと縮める大きさを引数で選ぶ"
    severity: error

  # 実際の時間に、ロジックの中から直接触れない。時間をおく処理はClockで、今の日付は日付を返す関数で、Core Animationの時間は時間を返す関数で受け取り、
  # 既定値はSciaCoreのSystemTimeかアプリのAppDependenciesを参照する。実物を作ってよいのはその2つのファイルだけにする。
  # デバッグ用のコード（ダミーのサーバーや部品カタログ）は、人が見るためにわざと遅らせるもので、テストで確かめるロジックではないため対象外にする
  direct_time_access:
    included: "(App/Sources|ShareExtension|Packages/SciaCore/Sources/SciaCore)/.*\\.swift"
    excluded: "(App/Sources/Debug/|App/Sources/AppDependencies\\.swift|Packages/SciaCore/Sources/SciaCore/SystemTime\\.swift)"
    regex: "\\b(Task\\.sleep|Thread\\.sleep|usleep|DispatchTime\\.now|CACurrentMediaTime|CFAbsoluteTimeGetCurrent|ContinuousClock|SuspendingClock|asyncAfter)\\b|\\bTimer(\\(|\\.scheduledTimer\\b|\\.publish\\b)|\\bDate\\(\\)|\\bDate\\.init\\b(?!\\([^)])|\\bDate\\.now\\b|\\bDate\\(timeIntervalSinceNow|(?<![\\w.)\\]])\\.now\\b|\\bsystemUptime\\b"
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "実際の時間に直接触れない。時間をおく処理はClockで、今の日付は日付を返す関数で受け取り、既定値はSystemTimeかAppDependenciesを参照する"
    severity: error

  # 文字の大きさを数字で決め打ちすると、端末の文字の大きさに従わない。書式（preferredFont）か、UIFontMetricsで大きさを変える文字で作る。
  # preferredFontのpointSizeから作った文字も、作った時点の大きさで止まるため、数字の幅を揃えるときはmonospacedDigitFont(forTextStyle:)で作る。
  # 枠の大きさが決まっていて文字を大きくできない場所（ステータスバーのように）だけ、拡大表示（Large Content Viewer）を付け、理由を書いてこの規則を外す
  fixed_font_size:
    included: "(App/Sources|ShareExtension)/.*\\.swift"
    excluded: "App/Sources/Debug/"
    regex: "^(?![^\\n]*scaledFont\\(for:)[^\\n]*\\b(systemFont|boldSystemFont|italicSystemFont|monospacedSystemFont|monospacedDigitSystemFont)\\(ofSize:|^(?![^\\n]*scaledFont\\(for:)[^\\n]*\\.system\\(size:"
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "文字の大きさを数字で決め打ちしない。書式で作るか、UIFontMetricsで大きさを変える。数字の幅を揃えるときはmonospacedDigitFont(forTextStyle:)で作る"
    severity: error

  # 白を透かして控えめにした文字は、明るい画像の上で読みにくくなる。コントラストを上げる設定に応えるよう、dimmedWhiteText(alpha:)で作る
  dimmed_white_text:
    included: "(App/Sources|ShareExtension)/.*\\.swift"
    excluded: "App/Sources/Debug/"
    regex: "(textColor|foregroundColor|\\.foregroundStyle)[^\\n]*\\bwhite\\b[^\\n]*(withAlphaComponent|opacity)\\("
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "半透明の白い文字はdimmedWhiteText(alpha:)で作り、コントラストを上げる設定で濃くする"
    severity: error

  # セッションの持ち物（各一覧、開いた画面、投稿欄）で始める処理は、持ち主（TaskScope）を通す。持ち主を通さないTaskは、ログアウト、アカウントの切り替え、
  # 窓を閉じたときに止まらず、前のアカウントのトークンで送り続けたり、終わった処理が溜まり続けたりしていた。止める処理の一覧を手で並べて保たずに済むよう、ここで止める。
  # 変化の知らせを受けてメインアクターへ戻るだけの乗り換え（`Task { @MainActor`）は、通信を持たないので対象外にする
  session_task_outside_scope:
    included: "App/Sources/(SessionController|Timeline/(FeedTimelineController|NotificationsController|SavedStatusesController)|Profile/(ProfileController|AccountListController)|Thread/ThreadController|Compose/(ComposeModel|InlineComposeController))\\.swift"
    regex: "\\bTask(\\.detached)?\\s*(\\{(?!\\s*@MainActor)|\\()"
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "セッションの持ち物で始める処理は、持ち主（TaskScope）のrunで始める。メインアクターへ戻るだけなら`Task { @MainActor`と書く"
    severity: error

strict: true
