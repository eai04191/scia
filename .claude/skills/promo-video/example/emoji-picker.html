<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden;background:var(--bg);font-family:"Hiragino Sans",-apple-system,sans-serif;color:var(--fg)}
