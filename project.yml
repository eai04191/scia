name: Scia
options:
  bundleIdPrefix: net.mizle
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  # アプリの文言は日本語で書いているため、UIKitなどが出すシステムの文言（共有シートの「コピー」など）も日本語にそろえる
  developmentLanguage: ja
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    SWIFT_UPCOMING_FEATURE_INTERNAL_IMPORTS_BY_DEFAULT: YES
packages:
  SciaCore:
    path: Packages/SciaCore
targets:
  Scia:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: SciaCore
    postBuildScripts:
      - name: Embed Build Info
        script: '"$SRCROOT/Tools/embed-build-info.sh"'
        # 入力に指定しないと、Info.plistを作る処理より先に走り、書き込んだ値が上書きされる
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        # ブランチの切り替えやcommitはXcodeの入力として追えないため、毎回走らせる
        basedOnDependencyAnalysis: false
      - name: Render App Icon Previews
        script: '"$SRCROOT/Tools/render-app-icon-previews.sh"'
        inputFiles:
          - $(SRCROOT)/App/Resources/AppIcon.icon/icon.json
          - $(SRCROOT)/App/Resources/AppIcon.icon/Assets/trail.svg
          - $(SRCROOT)/App/Resources/AppIconLight.icon/icon.json
          - $(SRCROOT)/App/Resources/AppIconLight.icon/Assets/trail.svg
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/AppIconPreview@3x.png
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/AppIconLightPreview@3x.png
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.mizle.scia
        # Info.plistのCFBundleShortVersionStringとCFBundleVersionになる。
        # iOSはなくてもインストールできるが、MacでDesigned for iPadとして動かすときはCFBundleVersionがないとインストールに失敗する
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 設定で選べる、白地に青のアイコン（App/Sources/Settings/AppIconChoice.swift）
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconLight
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # iPadとMac（Designed for iPad）では、4つの向きすべてに対応しないとウィンドウの大きさを自由に変えられない。
        # iPhoneの向きは変えないよう、iPad向けのキーだけに書く
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_CFBundleDisplayName: Scia
        # ビューアの共有から画像を写真に保存するため
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 添付ファイルのメディアを写真に保存します。
        CODE_SIGN_STYLE: Automatic
    info:
      path: App/Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
              # Macで添付ファイルのビューアを開く別のウィンドウ（App/Sources/Media/MediaWindow.swift）
              - UISceneConfigurationName: Media Viewer
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).MediaWindowSceneDelegate
        # iPhoneでは、これがないとCADisplayLinkやCAAnimationで指定したフレームレートが60Hzに抑えられる
        CADisableMinimumFrameDurationOnPhone: true
        # agentが`xcrun simctl openurl`でデバッグメニューの操作を呼ぶためのスキーム（App/Sources/Debug/DebugURL.swift）。
        # Info.plistは構成ごとに分けていないためReleaseにも登録されるが、受け取る処理が#if DEBUGの中にあるので、Releaseでは開いても何もしない。
        CFBundleURLTypes:
          # 他のアプリやショートカットから画面を開くスキーム（App/Sources/Navigation/AppURL.swift）。
          # OAuthの戻り先のnet.mizle.sciaはASWebAuthenticationSessionが受け取るため、取り合わないよう別にする。
          - CFBundleURLName: net.mizle.scia
            CFBundleURLSchemes:
              - scia
          - CFBundleURLName: net.mizle.scia.debug
            CFBundleURLSchemes:
              - scia-debug
        # 違和感レポートをファイルアプリから取り出せるようにする
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
  SciaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AppTests
    dependencies:
      - target: Scia
      - package: SciaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.mizle.scia.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Scia:
    build:
      targets:
        Scia: all
    test:
      targets:
        - package: SciaCore/SciaCoreTests
        - SciaTests
