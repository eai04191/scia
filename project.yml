name: Scia
options:
  bundleIdPrefix: net.mizle
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  # アプリの文言は日本語で書いているため、UIKitなどが出すシステムの文言（共有シートの「コピー」など）も日本語にそろえる
  developmentLanguage: ja
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    SWIFT_UPCOMING_FEATURE_INTERNAL_IMPORTS_BY_DEFAULT: YES
    # アプリのバンドルID、表示名、登録するURLスキーム。プロモーション動画の素材を撮るビルドは、Config/Promo.xcconfigで上書きし、
    # いつものSciaと並べて入れられるようにし、いつものSciaに届くURLを取らないようにする（docs/promo-video.md）
    SCIA_BUNDLE_ID: net.mizle.scia
    SCIA_DISPLAY_NAME: Scia
    SCIA_URL_SCHEME: scia
    SCIA_DEBUG_URL_SCHEME: scia-debug
    # 共有拡張が受け取ったメディアをアプリへ渡すためのApp Group（Packages/SciaCore/Sources/SciaCore/Compose/SharedMediaInbox.swift）
    SCIA_APP_GROUP: group.$(SCIA_BUNDLE_ID)
  configs:
    # 警告を止めるのは、make checkで通すDebugのビルドの役目にする。Releaseはmake checkでもhookでも通らないため、
    # Releaseにしかない書き方の警告や、Xcodeを上げて増えた警告で、出すときに初めてビルドが止まるのを避ける
    Release:
      SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
packages:
  SciaCore:
    path: Packages/SciaCore
targets:
  Scia:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: SciaCore
      - target: SciaShareExtension
    postBuildScripts:
      - name: Embed Build Info
        script: '"$SRCROOT/Tools/embed-build-info.sh"'
        # 入力に指定しないと、Info.plistを作る処理より先に走り、書き込んだ値が上書きされる
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        # ブランチの切り替えやcommitはXcodeの入力として追えないため、毎回走らせる
        basedOnDependencyAnalysis: false
      - name: Render App Icon Previews
        script: '"$SRCROOT/Tools/render-app-icon-previews.sh"'
        inputFiles:
          - $(SRCROOT)/App/Resources/AppIcon.icon/icon.json
          - $(SRCROOT)/App/Resources/AppIcon.icon/Assets/trail.svg
          - $(SRCROOT)/App/Resources/AppIconLight.icon/icon.json
          - $(SRCROOT)/App/Resources/AppIconLight.icon/Assets/trail.svg
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/AppIconPreview@3x.png
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/AppIconLightPreview@3x.png
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SCIA_BUNDLE_ID)
        # Info.plistのCFBundleShortVersionStringとCFBundleVersionになる。
        # iOSはなくてもインストールできるが、MacでDesigned for iPadとして動かすときはCFBundleVersionがないとインストールに失敗する
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 設定で選べる、白地に青のアイコン（App/Sources/Settings/AppIconChoice.swift）
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconLight
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # iPadとMac（Designed for iPad）では、4つの向きすべてに対応しないとウィンドウの大きさを自由に変えられない。
        # iPhoneの向きは変えないよう、iPad向けのキーだけに書く
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_CFBundleDisplayName: $(SCIA_DISPLAY_NAME)
        # ビューアの共有から画像を写真に保存するため
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 添付ファイルのメディアを写真に保存します。
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: App/Scia.entitlements
      properties:
        com.apple.security.application-groups:
          - $(SCIA_APP_GROUP)
    info:
      path: App/Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
              # Macで添付ファイルのビューアを開く別のウィンドウ（App/Sources/Media/MediaWindow.swift）
              - UISceneConfigurationName: Media Viewer
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).MediaWindowSceneDelegate
        # iPhoneでは、これがないとCADisplayLinkやCAAnimationで指定したフレームレートが60Hzに抑えられる
        CADisableMinimumFrameDurationOnPhone: true
        # agentが`xcrun simctl openurl`でデバッグメニューの操作を呼ぶためのスキーム（App/Sources/Debug/DebugURL.swift）。
        # Info.plistは構成ごとに分けていないためReleaseにも登録されるが、受け取る処理が#if DEBUGの中にあるので、Releaseでは開いても何もしない。
        CFBundleURLTypes:
          # 他のアプリやショートカットから画面を開くスキーム（App/Sources/Navigation/AppURL.swift）。
          # OAuthの戻り先のnet.mizle.sciaはASWebAuthenticationSessionが受け取るため、取り合わないよう別にする。
          - CFBundleURLName: net.mizle.scia
            CFBundleURLSchemes:
              - $(SCIA_URL_SCHEME)
          - CFBundleURLName: net.mizle.scia.debug
            CFBundleURLSchemes:
              - $(SCIA_DEBUG_URL_SCHEME)
        # アプリがURLを読むときに、自分のスキームを知るため
        SciaURLScheme: $(SCIA_URL_SCHEME)
        SciaDebugURLScheme: $(SCIA_DEBUG_URL_SCHEME)
        SciaAppGroup: $(SCIA_APP_GROUP)
        # 違和感レポートをファイルアプリから取り出せるようにする
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
  # 写真アプリやSafariなどの共有から投稿欄を開く共有拡張（ShareExtension/ShareViewController.swift）
  SciaShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
    dependencies:
      - package: SciaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SCIA_BUNDLE_ID).share
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: $(SCIA_DISPLAY_NAME)
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: ShareExtension/SciaShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - $(SCIA_APP_GROUP)
    info:
      path: ShareExtension/Info.plist
      properties:
        SciaURLScheme: $(SCIA_URL_SCHEME)
        SciaAppGroup: $(SCIA_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 4
              NSExtensionActivationSupportsMovieWithMaxCount: 4
              # Safariのページと、選んだ文のメニューの「共有」。選んだ文を引用して書き始める
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
            # Safariの共有ボタンから共有するとき、ページの中で選んでいる文とURLを読む
            NSExtensionJavaScriptPreprocessingFile: SharePreprocessing
  SciaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AppTests
    dependencies:
      - target: Scia
      - package: SciaCore
      - package: SciaCore
        product: SciaTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.mizle.scia.tests
        GENERATE_INFOPLIST_FILE: YES
  # プロモーション動画の素材を撮るシナリオ（docs/promo-video.md）。撮影モードで起動し、操作とイベントを順に送る
  SciaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AppUITests
    dependencies:
      - target: Scia
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.mizle.scia.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Scia
schemes:
  # シナリオは録画と合わせて走らせるため、make testで走る`Scia`のテストに混ぜない
  SciaPromo:
    build:
      targets:
        Scia: all
        SciaUITests: [test]
    test:
      targets:
        - SciaUITests
  Scia:
    build:
      targets:
        Scia: all
    test:
      targets:
        - package: SciaCore/SciaCoreTests
        - SciaTests
