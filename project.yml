name: Scia
options:
  bundleIdPrefix: net.mizle
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    SWIFT_UPCOMING_FEATURE_INTERNAL_IMPORTS_BY_DEFAULT: YES
packages:
  SciaCore:
    path: Packages/SciaCore
targets:
  Scia:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: SciaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.mizle.scia
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Scia
        # ビューアの共有から画像を写真に保存するため
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 添付ファイルの画像を写真に保存します。
        CODE_SIGN_STYLE: Automatic
    info:
      path: App/Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        # 違和感レポートをファイルアプリから取り出せるようにする
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
  SciaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AppTests
    dependencies:
      - target: Scia
      - package: SciaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.mizle.scia.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Scia:
    build:
      targets:
        Scia: all
    test:
      targets:
        - package: SciaCore/SciaCoreTests
        - SciaTests
