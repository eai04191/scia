# ログイン画面の補完に使うサーバーの一覧を、FediDBのデータセットから作り直してPRにする。
# FediDBは週1回（日曜）出力するので、月曜に取る。変わっていなければPRを作らず、前のPRが開いたままなら同じPRを更新する。
name: Update known servers

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: Tools/update-known-servers.sh
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/update-known-servers
          commit-message: "chore: ログイン画面の補完に使うサーバーの一覧をFediDBの最新の出力に合わせる"
          title: "chore: ログイン画面の補完に使うサーバーの一覧を更新する"
          body: "FediDBのデータセット（https://fedidb.com/datasets 、CC BY 4.0）から、`Tools/update-known-servers.sh`で作り直しました。FediDBに載らないサーバーは、`Tools/known-servers-extra.txt`のものをNodeInfoから足しています。"
          delete-branch: true
